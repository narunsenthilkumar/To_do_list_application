# ==============================================================================
# Codemagic CI/CD Configuration for Taskora (React Native / Expo)
# Repository: github.com/narunsenthilkumar/To_do_list_application
# ==============================================================================

workflows:
  # ----------------------------------------------------------------------------
  # 1. ANDROID RELEASE WORKFLOW (APK & Google Play Bundle)
  # ----------------------------------------------------------------------------
  android-release:
    name: Android Production Release (APK & AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.18.0
      java: 21
      vars:
        PACKAGE_NAME: "com.taskora.app"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Generate Android Native Project via Expo Prebuild
        script: |
          npx expo prebuild --platform android --clean --no-install
      - name: Set up Android SDK & Gradle Permissions
        script: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > android/local.properties
          chmod +x android/gradlew
      - name: Build Android Release (APK & AAB)
        script: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - narunjs23@gmail.com
        notify:
          success: true
          failure: true

  # ----------------------------------------------------------------------------
  # 2. ANDROID DEBUG / PR WORKFLOW (Quick Testing APK)
  # ----------------------------------------------------------------------------
  android-debug:
    name: Android Debug Build (Fast Testing APK)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: 20.18.0
      java: 21
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Generate Android Native Project via Expo Prebuild
        script: |
          npx expo prebuild --platform android --clean --no-install
      - name: Set up Android SDK & Gradle Permissions
        script: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > android/local.properties
          chmod +x android/gradlew
      - name: Build Android Debug APK
        script: |
          cd android
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - narunjs23@gmail.com
        notify:
          success: true
          failure: true

  # ----------------------------------------------------------------------------
  # 3. IOS BUILD WORKFLOW (Expo Prebuild + Xcode Archive)
  # ----------------------------------------------------------------------------
  ios-release:
    name: iOS Production Build (IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.18.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.taskora.app"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Generate iOS Native Project via Expo Prebuild
        script: |
          npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up code signing settings
        script: |
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/Taskora.xcworkspace" \
            --scheme "Taskora"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - "*.dSYM.zip"
    publishing:
      email:
        recipients:
          - narunjs23@gmail.com
        notify:
          success: true
          failure: true

  # ----------------------------------------------------------------------------
  # 4. WEB BUILD WORKFLOW (Single Page App Export)
  # ----------------------------------------------------------------------------
  web-export:
    name: Web Single Page App Export
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      node: 20.18.0
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Export Web Application
        script: |
          npm run build:web
    artifacts:
      - dist/**
    publishing:
      email:
        recipients:
          - narunjs23@gmail.com
        notify:
          success: true
          failure: true
